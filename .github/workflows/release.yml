name: release

on:
  workflow_run:
    workflows: [package]
    types: [completed]

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Extract the changelog section for this version
        run: |
          version="${RELEASE_TAG#v}"
          python3 - "$version" CHANGELOG.md dist/RELEASE_CHANGELOG.md <<'PY'
          import sys

          version, source, target = sys.argv[1], sys.argv[2], sys.argv[3]
          lines = open(source, encoding="utf-8").read().splitlines()
          marker = f"## [{version}]"
          # Keep-a-Changelog headers carry a date suffix ("## [0.2.1] - 2026-11-11");
          # prefix-match but reject a following digit so 0.2.1 never matches 0.2.10.
          def is_header(line):
              return line.startswith(marker) and not line[len(marker):len(marker) + 1].isdigit()
          start = next((i for i, line in enumerate(lines) if is_header(line)), None)
          if start is None:
              open(target, "w", encoding="utf-8").write(
                  f"(No `## [{version}]` section found in CHANGELOG.md.)\n")
          else:
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
              section = [lines[start]] + [line for line in lines[start + 1:end]]
              while section and not section[-1].strip():
                  section.pop()
              open(target, "w", encoding="utf-8").write("\n".join(section) + "\n")
          PY

      - name: Bundle release assets and checksums
        run: |
          cd dist
          rm -rf release-checksums
          D=$(pwd)
          (cd wattledger-cli-win-x64 && zip -r "$D/wattledger-cli-win-x64.zip" .)
          (cd wattledger-desktop-win-x64 && zip -r "$D/wattledger-desktop-win-x64.zip" .)
          (cd wattledger-linux-x64-ubuntu-24.04/cli-linux-x64 && zip -r "$D/wattledger-cli-linux-x64.zip" .)
          (cd wattledger-linux-x64-ubuntu-24.04/desktop-linux-x64 && zip -r "$D/wattledger-desktop-linux-x64.zip" .)
          cp wattledger-deb-linux-x64/wattledger-linux-x64.deb .
          {
            cat RELEASE_CHANGELOG.md
            echo
            echo "## 校验和 (SHA-256)"
            echo
            echo '```'
            sha256sum wattledger-cli-win-x64.zip wattledger-desktop-win-x64.zip \
              wattledger-cli-linux-x64.zip wattledger-desktop-linux-x64.zip \
              wattledger-linux-x64.deb | tee checksums.txt
            echo '```'
          } > RELEASE_BODY.md

      - name: Create draft release (manual publish)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.event.workflow_run.head_branch }}
          name: WattLedger ${{ github.event.workflow_run.head_branch }}
          body_path: dist/RELEASE_BODY.md
          files: |
            dist/wattledger-cli-win-x64.zip
            dist/wattledger-desktop-win-x64.zip
            dist/wattledger-cli-linux-x64.zip
            dist/wattledger-desktop-linux-x64.zip
            dist/wattledger-linux-x64.deb
            dist/checksums.txt
