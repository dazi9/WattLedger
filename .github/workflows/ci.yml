name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WattLedger.slnx

      - name: Build
        run: dotnet build WattLedger.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/WattLedger.Core.Tests/WattLedger.Core.Tests.csproj -c Release --no-build

      - name: Publish CLI (self-contained, single file)
        run: >
          dotnet publish src/WattLedger.Cli/WattLedger.Cli.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/cli

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: wattledger-cli-win-x64
          path: artifacts/cli
          if-no-files-found: error
