name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify formatting (Windows solution)
        run: dotnet format WattLedger.slnx --verify-no-changes

      - name: Verify formatting (Linux solution)
        run: dotnet format WattLedger.Linux.slnx --verify-no-changes
